<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NINJA FORCE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-container">
    <!-- En-tête de l'application -->
    <header>
      <h1>🥷 NINJA FORCE</h1>
    </header>

    <!-- 1. Écran de sélection des séances -->
    <section id="routine-selector-screen" class="screen">
      <h2>Mes Séances</h2>
      
      <div id="saved-routines-list" class="routines-list">
        <!-- Les séances personnalisées s'afficheront ici avec leur durée -->
      </div>

      <button id="btn-create-routine" class="btn-primary">Créer une nouvelle séance</button>
      <button id="btn-library" class="btn-secondary">Fiches d'exercices (16)</button>
    </section>

    <!-- 2. Écran de création / personnalisation d'une séance -->
    <section id="routine-creator-screen" class="screen" style="display: none;">
      <h2>Personnaliser ma séance</h2>
      
      <div class="form-group">
        <label for="routine-name">Nom de la séance :</label>
        <input type="text" id="routine-name" placeholder="Ex: Routine matinale">
      </div>

      <div class="form-group">
        <label for="routine-rounds">Nombre de tours :</label>
        <input type="number" id="routine-rounds" value="3" min="1" max="10">
      </div>

      <!-- Affichage de la durée estimée en direct -->
      <div id="estimated-time-box" class="estimated-time-box">
        ⏱️ Durée estimée : <span id="estimated-time-display">0 min</span>
      </div>

      <h3>Sélectionne tes exercices :</h3>
      <div id="exercise-checkboxes-list" class="exercises-checkbox-container">
        <!-- Liste des 16 exercices -->
      </div>

      <div class="creator-actions">
        <button id="btn-save-routine" class="btn-primary">Enregistrer la séance</button>
        <button id="btn-cancel-routine" class="btn-secondary">Annuler</button>
      </div>
    </section>

    <!-- 3. Écran d'entraînement actif -->
    <section id="workout-screen" class="screen" style="display: none;">
      <div class="workout-header">
        <span id="current-routine-title">Séance</span>
        <span id="round-counter">Tour 1/3</span>
      </div>

      <div class="exercise-card">
        <h3 id="exercise-name">Nom de l'exercice</h3>
        <div class="exercise-image">
          <img id="exercise-img" src="" alt="Illustration exercice">
        </div>
        <p id="exercise-desc">Description de l'exercice</p>
        <div id="timer-display" class="timer">00:30</div>
      </div>

      <div class="workout-actions">
        <button id="btn-pause" class="btn-secondary">Pause</button>
        <button id="btn-next" class="btn-primary">Suivant</button>
        <button id="btn-abandon" class="btn-abandon">Abandonner</button>
      </div>
    </section>

    <!-- 4. Écran de fin / félicitations -->
    <section id="completion-screen" class="screen" style="display: none;">
      <h2>🎉 Bravo Ninja !</h2>
      <p>Séance terminée avec succès !</p>
      <button id="btn-home" class="btn-primary">Retour aux séances</button>
    </section>

    <!-- 5. Écran de la bibliothèque / fiches d'exercices -->
    <section id="library-screen" class="screen" style="display: none;">
      <h2>Bibliothèque des fiches</h2>
      <div id="library-exercises-list" class="library-container">
        <!-- Les 16 fiches d'exercices s'afficheront ici -->
      </div>
      <button id="btn-library-back" class="btn-primary">Retour</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
