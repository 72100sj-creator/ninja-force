<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninja Force V1.4</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Manifest pour la PWA -->
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- EN-TÊTE -->
    <header class="app-header">
        <div class="ninja-logo">🥷 NINJA FORCE</div>
    </header>

    <!-- ÉCRAN : ACCUEIL / LISTE DES ROUTINES -->
    <section id="screen-home" class="screen active">
        <h2>Mes Routines</h2>
        <div id="routines-list" class="routines-container">
            <!-- Les routines apparaîtront ici -->
        </div>
        <button class="btn-primary mt-20" onclick="App.openBuilder()">+ Créer une Routine</button>
    </section>

    <!-- ÉCRAN : CONSTRUCTEUR DE ROUTINE -->
    <section id="screen-builder" class="screen">
        <h2 id="builder-title">Nouvelle Routine</h2>
        
        <div class="builder-layout">
            <div class="available-exercises">
                <h3>Catalogue</h3>
                <div id="catalogue-list" class="scroll-list"></div>
            </div>
            
            <div class="selected-exercises">
                <h3>Ma Routine</h3>
                <div id="selected-list" class="scroll-list"></div>
                
                <div class="builder-controls">
                    <label>Nom : <input type="text" id="routine-name" placeholder="Ex: Routine Express"></label>
                    <label>Tours : <input type="number" id="routine-rounds" value="3" min="1" max="10"></label>
                    <button class="btn-success" onclick="App.saveRoutine()">Sauvegarder</button>
                    <button class="btn-secondary" onclick="App.showScreen('screen-home')">Annuler</button>
                </div>
            </div>
        </div>
    </section>

    <!-- ÉCRAN : MOTEUR DE SÉANCE EN COURS -->
    <section id="screen-workout" class="screen">
        <div class="workout-header">
            <span id="workout-progress-tours" class="badge">Tour 1/3</span>
            <span id="workout-progress-exos" class="badge">Exercice 1/5</span>
        </div>
        
        <div class="workout-main">
            <h1 id="workout-status" class="status-text">Préparation</h1>
            <h2 id="workout-exercise-name" class="exercise-title">Préparez-vous</h2>
            <div class="timer-circle">
                <span id="workout-timer">10</span>
            </div>
            <!-- Image de l'exercice -->
            <div id="workout-image-container" class="image-container">
                 <span id="workout-emoji" class="workout-emoji-large">🥷</span>
            </div>
        </div>

        <div class="workout-controls">
            <button id="btn-pause" class="btn-secondary" onclick="WorkoutEngine.togglePause()">Pause</button>
            <button class="btn-danger" onclick="WorkoutEngine.abandon()">Abandonner</button>
            <!-- Le bouton Suivant a été supprimé comme demandé -->
        </div>
    </section>

    <!-- ÉCRAN : FIN DE SÉANCE -->
    <section id="screen-summary" class="screen text-center">
        <h1 class="ninja-logo large">🥷</h1>
        <h2>SÉANCE TERMINÉE !</h2>
        <p>Bravo, vous avez complété votre entraînement avec succès.</p>
        
        <div class="summary-stats">
            <p>Durée totale : <strong id="summary-duration">00:00</strong></p>
            <p>Tours réalisés : <strong id="summary-rounds">3/3</strong></p>
            <p>Exercices par tour : <strong id="summary-exercises">5</strong></p>
        </div>

        <button class="btn-primary mt-20" onclick="App.showScreen('screen-home')">TERMINER</button>
    </section>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
