<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ninja Force</title>
    <meta name="theme-color" content="#111111">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
</head>
<body>

    <!-- CONTENU PRINCIPAL -->
    <main id="main-content">
        <!-- VUE ACCUEIL -->
        <section id="view-home" class="view active">
            <h1 class="logo">🥷 NINJA FORCE</h1>
            <div class="card summary-card">
                <h2>Programme Actif</h2>
                <p><strong>8 Exercices</strong></p>
                <p>Durée estimée : ~12 minutes</p>
                <p>Tours : 2</p>
                <button id="btn-start-home" class="btn-giant">COMMENCER</button>
            </div>
            <p class="version">V1.0</p>
        </section>

        <!-- VUE BIBLIOTHÈQUE / PERSONNALISATION -->
        <section id="view-library" class="view">
            <h2>📖 Exercices & Programme</h2>
            <p class="subtitle">Coche 8 exercices pour ton programme.</p>
            <div id="exercises-list" class="list-container"></div>
            <button id="btn-save-program" class="btn-large" style="display:none;">Enregistrer (8/8)</button>
        </section>

        <!-- VUE HISTORIQUE -->
        <section id="view-history" class="view">
            <h2>📊 Historique</h2>
            <div id="history-list" class="list-container"></div>
        </section>

        <!-- VUE SÉANCE (masquée par défaut, s'affiche en plein écran) -->
        <section id="view-workout" class="view full-screen">
            <div class="workout-header">
                <span id="workout-phase">Préparation</span>
                <span id="workout-round">Tour 1/2</span>
            </div>
            <h2 id="workout-title">Prépare-toi...</h2>
            <div class="workout-display">
                <div id="workout-value">10</div>
                <div id="workout-unit">secondes</div>
            </div>
            <div class="workout-controls">
                <button id="btn-workout-action" class="btn-giant">SUIVANT</button>
                <div class="secondary-controls">
                    <button id="btn-workout-pause" class="btn-secondary">⏸ Pause</button>
                    <button id="btn-workout-help" class="btn-secondary">❔ Fiche</button>
                    <button id="btn-workout-quit" class="btn-danger">Abandonner</button>
                </div>
            </div>
        </section>
    </main>

    <!-- NAVIGATION DU BAS -->
    <nav id="bottom-nav">
        <button class="nav-btn active" data-target="view-home">🏠<br>Accueil</button>
        <button class="nav-btn" data-target="view-library">📖<br>Exercices</button>
        <button class="nav-btn" data-target="view-history">📊<br>Historique</button>
    </nav>

    <!-- MODAL FICHE EXERCICE -->
    <div id="exercise-modal" class="modal">
        <div class="modal-content">
            <button id="btn-close-modal" class="btn-close">✖ Fermer</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/storage.js"></script>
    <script src="js/exercises.js"></script>
    <script src="js/workout.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>
</html>
