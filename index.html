<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninja Force V1.4.1</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Ninja Force">
</head>
<body>

    <!-- ÉCRAN : ACCUEIL -->
    <section id="screen-home" class="screen active">
        <h2>Mes Routines</h2>
        <div id="routines-list" class="routines-container"></div>
        <button class="btn-primary mt-20" onclick="App.openBuilder()">+ Créer une Routine</button>
        <button class="btn-secondary mt-20" onclick="App.showScreen('screen-history')">🕒 Historique des séances</button>
        <p class="app-version">Ninja Force · v1.6</p>
    </section>

    <!-- ÉCRAN : CONSTRUCTEUR -->
    <section id="screen-builder" class="screen">
        <h2 id="builder-title">Nouvelle Routine</h2>
        
        <div class="builder-layout">
            <div class="available-exercises">
                <h3>Catalogue</h3>
                <div id="catalogue-list" class="scroll-list"></div>
            </div>
            
            <div class="selected-exercises">
                <h3>Ma Routine</h3>
                <div id="selected-list" class="scroll-list"></div>
                
                <div class="builder-controls">
                    <label>Nom : <input type="text" id="routine-name" placeholder="Ex: Routine Express"></label>
                    <label>Tours : <input type="number" id="routine-rounds" value="3" min="1" max="10"></label>
                    <button class="btn-success" onclick="App.saveRoutine()">Sauvegarder</button>
                    <button class="btn-secondary" onclick="App.showScreen('screen-home')">Annuler</button>
                </div>
            </div>
        </div>
    </section>

    <!-- ÉCRAN : MOTEUR DE SÉANCE -->
    <section id="screen-workout" class="screen">
        <div class="workout-main">
            <div class="ninja-avatar-wrap">
                <img id="workout-ninja" src="" alt="" class="ninja-avatar">
            </div>
            <h1 id="workout-status" class="status-text">Préparation</h1>
            <h2 id="workout-exercise-name" class="exercise-title">Préparez-vous</h2>
            
            <div class="workout-status-row">
                <span id="workout-progress-tours" class="badge badge-side">Tour 1/3</span>
                <div class="timer-circle">
                    <span id="workout-timer">10</span>
                </div>
                <span id="workout-progress-exos" class="badge badge-side">Exercice 1/5</span>
            </div>
            
            <!-- Conteneur d'image restauré -->
            <div id="workout-image-container" class="image-container">
                 <img id="workout-image" src="" alt="Exercice en cours" class="workout-image-large">
            </div>
        </div>

        <div class="workout-controls">
            <button id="btn-pause" class="btn-secondary" onclick="WorkoutEngine.togglePause()">Pause</button>
        </div>
        
        <!-- Bouton abandon déplacé en dessous et réduit -->
        <div class="workout-footer">
            <button class="btn-danger btn-small btn-abandon" onclick="WorkoutEngine.abandon()">Abandonner la séance</button>
        </div>
    </section>

    <!-- ÉCRAN : FIN DE SÉANCE -->
    <section id="screen-summary" class="screen text-center">
        <img src="assets/mascot/ninja-victory.png" alt="" class="summary-mascot">
        <h2>SÉANCE TERMINÉE !</h2>
        <p>Bravo, vous avez complété votre entraînement avec succès.</p>
        
        <div class="summary-stats">
            <p>Durée totale : <strong id="summary-duration">00:00</strong></p>
            <p>Tours réalisés : <strong id="summary-rounds">3/3</strong></p>
            <p>Exercices par tour : <strong id="summary-exercises">5</strong></p>
        </div>

        <button class="btn-primary mt-20" onclick="App.showScreen('screen-home')">TERMINER</button>
    </section>

    <!-- ÉCRAN : HISTORIQUE -->
    <section id="screen-history" class="screen">
        <h2>Historique des séances</h2>
        <div id="history-list"></div>
        <button class="btn-secondary mt-20" onclick="App.showScreen('screen-home')">Retour</button>
    </section>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
